# no-mistakes pipeline settings for this fork (VinSpee/openpocket); not proposed upstream.
# commands and test.instructions are read from the default branch, so edits here take effect only after they merge.
# Lint is left to the pipeline's agent: the project has no linter of its own.

commands:
  # The pinned linux/amd64 toolchain image; fails at once with a clear message when Docker is not running.
  prepare: "node tools/op.mjs image"
  # The build with its byte checks (and the release pin, where tests/release_pin.sh exists), then the host tests.
  test: "node tools/op.mjs package && node tools/op.mjs test"

test:
  instructions: |
    OpenPocket is guitar-pedal firmware (Donner Pocket X, M-VAVE BlackBox), a web installer (docs/index.html), a web editor (docs/editor.html) and a simulated pedal. There is no server, account or secret. Everything below runs on this host; never contact a real pedal.
    Tools: Node 18+, Docker with the pinned image openpocket-build (`node tools/op.mjs image`), cc and python3. `node tools/op.mjs doctor` checks them. Under emulation on Apple silicon `package` takes under a minute and `test` from a few minutes to about 20 when other builds share Docker; wait for each to exit and read its exit status. The configured test command has already run `package` and `test` once on this head; use its output and run them again only after a code change.
    - Build and release pin: `node tools/op.mjs package` writes firmware/openpocket.bin, docs/firmware/*.fwsc, manifest.json and build/SHA256SUMS. Where tests/release_pin.sh exists it runs at the end; pass is the line "release pin: OpenPocket's image and packages are the release's, byte for byte". Where it does not exist, prove the same thing: extract the merge base with `git archive <base> | tar -x -C <empty temp dir>`, run `node tools/op.mjs package` there, and compare the four lines of the two build/SHA256SUMS files (firmware/openpocket.bin, the two current .fwsc packages, manifest.json); older .fwsc files left in docs/firmware only add lines. Only a deliberate new OpenPocket release may change these bytes. For a change to the base firmware or an app, also run `node tools/op.mjs app <name>` for each app in firmware/apps.
    - Host tests: `node tools/op.mjs test` runs tests/run_tests.sh in the container (engine, preset store, screen, the update protocol on a simulated pedal, installer, flasher, rescue tool, hosted simulator, editor). Pass: exit 0 with every section ok or passed. It leaves Linux binaries in build/edsim and build/devsim; the pages script below rebuilds them for this host.
    - Pages in headless Chromium: `sh .claude/skills/verify/scripts/pages.sh` drives the installer, the editor, the pedal skin and the sound page against the simulated pedals with a mocked Web MIDI device. Pass: "page test passed", "editor page test passed" and "pedal page: ok"; screenshots land in build/page, build/editor, build/pedal and build/audio. Playwright comes from PW_DIR (default ~/.cache/openpocket-pw). If it is missing, install it into an empty directory of your own: write `{}` to <dir>/package.json first (without it pnpm installs into the home folder), run `pnpm --dir <dir> --ignore-workspace add playwright` (npm does not run on this host) and `<dir>/node_modules/.bin/playwright install chromium`, then set PW_DIR=<dir>.
    - The pedal as a user plays it: `node tools/sim.mjs --port <free port> --flash <temp file> --reset` starts the simulated pedal (the firmware's own screen, editor and preset-store code; `op.mjs sim` is the same with a wrapper that leaves the simulator running when only the wrapper is killed). Stop it with SIGTERM to that node process, which also stops its edsim child. Press and turn its controls with POST /api/press/NAME and /api/knob/N, then read GET /api/state and /api/screen.png (docs/SIMULATOR.md lists every path). It serves the installer and editor at /site/index.html and /site/editor.html with a virtual Web MIDI pedal; drive them with Playwright or chrome-devtools-axi. `node tools/sim.mjs --port <free port> --update <flash image>` is the simulated update pedal for the installer (tests/fixtures.py DIR makes an image and packages).
    - Sound in the simulator: `node tests/test_audio.mjs` (the WebAssembly engine against the native build on known signals); every line must be ok.
    - Cleanup: stop every simulator, server and browser you started (kill only your own PIDs) and copy evidence out of build/ before `node tools/op.mjs clean`. Never run git checkout or rebase in the worktree while `op.mjs test` runs.
    Bounded exclusion: anything that needs a physical pedal is outside this pipeline. That is flashing (`op.mjs flash`, `rescue --write`), audio on the pedal, the DSP load and late blocks on hardware (`op.mjs dsp`), USB enumeration and USB audio on a real computer, Bluetooth on the radio, and the real LCD. Never run `op.mjs flash`, `log`, `dsp`, `rescue --write` or the Bluetooth scan. Record such a scenario as untested, not live, with the reason "needs a physical pedal; covered by the PR's pedal drill checklist", and name the host check that covers its code (the release pin or byte comparison, tests/test_flash.mjs, tests/test_usb_audio.c, tests/test_ble_status.c, tests/test_log.mjs). These excluded scenarios alone do not make the verdict inconclusive: judge go or no-go on the scenarios that can run here, and report inconclusive only when one of those could not be completed.
