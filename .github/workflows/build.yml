name: build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# a newer push to a pull request stops the run of the older one; every push to main runs to its end
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-and-test:   # branch protection requires this name: do not rename it
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the container, OpenPocket (it fails when its packages are not the release's bytes) and every app of firmware/apps, then run the host tests with the packages built
        run: node tools/op.mjs all
      - name: Build the MIDI test channel package (never the installer default)
        run: node tools/op.mjs package-test
      - name: Build the rescue kit (the host tests fail when it is not the pinned kit, rescue/kit.sha256)
        run: node tools/op.mjs kit
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}   # also after a failed test, so that the packages it ran on can be read
        with:
          name: firmware
          path: |
            firmware/openpocket.bin
            firmware/openpocket-midi-test.bin
            docs/firmware/*.fwsc
            docs/firmware/manifest.json
            docs/firmware/midi-test/
            docs/rescue/
            build/SHA256SUMS
            build/SHA256SUMS-midi-test
            build/apps/*/*.bin
            build/apps/*/*.fwsc
            build/apps/*/manifest.json
            build/apps/*/SHA256SUMS
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium with its system libraries, outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm i playwright
          npx playwright install --with-deps chromium
      - name: The installer, the editor, the pedal skin and the sound page in headless Chromium against the simulated pedals
        run: PW_DIR="$RUNNER_TEMP/pw" sh .claude/skills/verify/scripts/pages.sh
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: page-screenshots
          path: |
            build/page/
            build/editor/
            build/pedal/
            build/audio/
  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Model-check the TLA+ specifications and the firmware's recorded flash order (formal/README.md)
        run: npm ci --prefix formal && node formal/check.mjs
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium with its system libraries, outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm i playwright
          npx playwright install --with-deps chromium
      - name: Build the site container as it will be deployed, check its release step, and run the installer and editor page tests against it (site/README.md)
        run: PW_DIR="$RUNNER_TEMP/pw" sh .claude/skills/verify/scripts/pages.sh site
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: site-screenshots
          path: build/site/
