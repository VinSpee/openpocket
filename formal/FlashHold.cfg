\* The code: nm_scan and ir_scan read the flash before st_audio_hold(0), inside the hold. Gap = FALSE: the main loop
\* never runs between the interrupt's two callbacks (FlashHoldFixed.cfg drops that).
\* Expected: no error. With ScanInsideHold = FALSE, the order before the fix of F1 (formal/FINDINGS.md),
\* XipExclusion is violated.
SPECIFICATION Spec
CONSTANTS
  Modes = {"oneshot", "worker"}
  ScanInsideHold = TRUE
  Collect = TRUE
  Gap = FALSE
INVARIANTS TypeOK IsrNeedsIrqOn XipExclusion
PROPERTY Finishes
CHECK_DEADLOCK FALSE
