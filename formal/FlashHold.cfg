\* The code as it is: nm_scan and ir_scan read the flash after st_audio_hold(0). Gap = FALSE is the case that
\* favours the code: the main loop never runs between the interrupt's two callbacks.
\* Expected: XipExclusion is violated all the same (formal/FINDINGS.md, F1).
SPECIFICATION Spec
CONSTANTS
  Modes = {"oneshot", "worker"}
  ScanInsideHold = FALSE
  Collect = TRUE
  Gap = FALSE
INVARIANTS TypeOK IsrNeedsIrqOn XipExclusion
CHECK_DEADLOCK FALSE
