\* The code without the NAM layer split, assuming that the main loop never runs between the interrupt's two
\* callbacks (Gap = FALSE). Expected: no error. FlashHoldOneShotGap.cfg drops the assumption.
\* (This case passed before the fix of F1 too: a_send waits for the block's job, so under that assumption CPU1 is
\* idle whenever the main loop runs.)
SPECIFICATION Spec
CONSTANTS
  Modes = {"oneshot"}
  ScanInsideHold = TRUE
  Collect = TRUE
  Gap = FALSE
INVARIANTS TypeOK IsrNeedsIrqOn XipExclusion
PROPERTY Finishes
CHECK_DEADLOCK FALSE
