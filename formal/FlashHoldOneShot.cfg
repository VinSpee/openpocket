\* The code as it is, without the NAM layer split, and assuming that the main loop never runs between the
\* interrupt's two callbacks (Gap = FALSE). Expected: no error: a_send waits for the block's job, so under that
\* assumption CPU1 is idle whenever the main loop runs. FlashHoldOneShotGap.cfg drops the assumption.
SPECIFICATION Spec
CONSTANTS
  Modes = {"oneshot"}
  ScanInsideHold = FALSE
  Collect = TRUE
  Gap = FALSE
INVARIANTS TypeOK IsrNeedsIrqOn XipExclusion
PROPERTY Finishes
CHECK_DEADLOCK FALSE
